syntax = "proto3";

package inventory;

// Inventory service contract: check whether an item/quantity is in stock.
service InventoryService {
  rpc CheckInventory(CheckRequest) returns (CheckResponse);
}

message CheckRequest {
  string item_id = 1;
  int32 quantity = 2;
}

message CheckResponse {
  bool available = 1;
  int32 stock = 2;
  string message = 3;
}
