<text x="20" y="68" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="14" fill="#4ec9b0">manoj@mac ~/manoj % demo 3 — order service still running after the timeout (same process)</text>
<text x="20" y="90" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="14" fill="#d4d4d4"> </text>
<text x="20" y="112" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="14" fill="#d4d4d4">manoj@mac ~/manoj % curl -X POST localhost:5000/order -H &quot;Content-Type: application/json&quot; -d</text>
<text x="20" y="134" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="14" fill="#d4d4d4">&#x27;{&quot;item_id&quot;:&quot;widget&quot;,&quot;quantity&quot;:2}&#x27;   # order service (PID 1754) survived the timeout</text>
<text x="20" y="156" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="14" fill="#d4d4d4">{&quot;item_id&quot;:&quot;widget&quot;,&quot;quantity&quot;:2,&quot;status&quot;:&quot;confirmed&quot;}</text>
<text x="20" y="178" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="14" fill="#d4d4d4"> </text>
<text x="20" y="200" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="14" fill="#d4d4d4">HTTP 201</text>
